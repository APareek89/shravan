name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/shravan
      ANTHROPIC_API_KEY: ci-placeholder
      CRON_SECRET: ci-placeholder-secret-000000000000
      DEMO_SESSION_SECRET: ci-placeholder-secret-000000000000
      ENABLE_PUBLIC_DEMO: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
